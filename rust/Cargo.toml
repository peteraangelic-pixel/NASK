[workspace]
resolver = "2"
members = [
    "common",
    "subenum",
    "ffuzz",
    "probe",
    "takeover",
    "native",
    "../nask-lab/nasktriage",
    "../nask-lab/naskhunt",
    "../nask-lab/recon",
]

[workspace.dependencies]
rayon = "1.10"
ureq = { version = "2.11", default-features = false, features = ["tls"] }
common = { path = "common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
