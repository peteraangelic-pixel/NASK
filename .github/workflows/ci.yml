name: CI

on:
  push:
    branches: [arena/a29ca234-nask]
  pull_request:
    branches: [arena/a29ca234-nask]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zainstaluj Rusta (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Sformatuj kod (cargo fmt)
        run: cargo fmt
        working-directory: rust
        continue-on-error: true

      - name: Clippy (linter)
        run: cargo clippy --all-targets
        working-directory: rust

      - name: Kompiluj w trybie release
        run: cargo build --release
        working-directory: rust

      - name: Uruchom testy
        run: cargo test
        working-directory: rust

      - name: Wyświetl rozmiar binarzy
        run: ls -lh target/release/subenum target/release/ffuzz target/release/probe
        working-directory: rust
