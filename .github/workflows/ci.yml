name: CI

on:
  push:
    branches: [arena/a29ca234-nask]
  pull_request:
    branches: [arena/a29ca234-nask]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zainstaluj Rusta (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Sformatuj kod (cargo fmt)
        run: cargo fmt
        working-directory: rust
        continue-on-error: true

      - name: Clippy (linter, nieblocking)
        run: cargo clippy --all-targets || true
        working-directory: rust

      # Kompilacja i testy pozostawiamy użytkownikowi na jego maszynie (Ryzen 9 5950X).
      # W CI sprawdzamy tylko formatowanie i clippy (nieblocking).
